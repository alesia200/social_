<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layouts::head('Форма пользователя')}">
<body>
<div th:replace="~{fragments/layouts::header}"></div>
<div class="container-fluid">
    <div class="row">
        <!-- Сайдбар -->
        <div class="col-md-3 col-lg-2 p-0">
            <div th:replace="~{fragments/layouts::sidebar}"></div>
        </div>

        <!-- Основной контент страницы -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-3">
            <div class="container">
                <div class="card" style="max-width: 600px; margin: auto;">
                    <div class="card-header bg-primary text-white">
                        <!-- Заголовок меняется в зависимости от того, новый это пользователь или нет -->
                        <h4 th:if="${user.id == null}">Добавление пользователя</h4>
                        <h4 th:if="${user.id != null}">Редактирование пользователя</h4>
                    </div>
                    <div class="card-body">
                        <!-- Форма отправляет данные на /admin/users/save -->
                        <form th:action="@{/admin/users/save}" th:object="${user}" method="post">

                            <!-- Скрытое поле ID (нужно для редактирования) -->
                            <input type="hidden" th:field="*{id}" />
                            <!-- Поле Логин -->
                            <div class="mb-3">
                                <label class="form-label">Логин</label>
                                <input type="text"
                                       th:field="*{username}" class="form-control"
                                       th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Ошибка валидации</div>
                            </div>

                            <!-- Поле Пароль -->
                            <div class="mb-3">
                                <label class="form-label">Пароль</label>
                                <input type="password" th:field="*{password}" class="form-control"
                                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Ошибка</div>
                            </div>
                            <!-- Поле Роль -->
                            <div class="mb-3">
                                <label class="form-label">Роль</label>
                                <select th:field="*{role}" class="form-select">
                                    <!-- Перебираем все значения Enum Role -->
                                    <option th:each="role : ${T(com.example.social.model.Role).values()}"
                                            th:value="${role}"
                                            th:text="${role}">
                                    </option>
                                </select>
                            </div>

                            <hr>
                            <h5>Личные данные</h5>
                            <!-- Поле Фамилия -->
                            <div class="mb-3">
                                <label class="form-label">Фамилия</label>
                                <input type="text" th:field="*{surname}" class="form-control"
                                       th:classappend="${#fields.hasErrors('surname')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('surname')}" th:errors="*{surname}">Ошибка</div>
                            </div>
                            <!-- Поле Имя -->
                            <div class="mb-3">
                                <label class="form-label">Имя</label>
                                <input type="text" th:field="*{name}" class="form-control"
                                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Ошибка</div>
                            </div>
                            <!-- Поле Отчество -->
                            <div class="mb-3">
                                <label class="form-label">Отчество</label>
                                <input type="text" th:field="*{patronymic}" class="form-control"
                                       th:classappend="${#fields.hasErrors('patronymic')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('patronymic')}" th:errors="*{patronymic}">Ошибка</div>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a href="/admin/users" class="btn btn-secondary">Отмена</a>
                                <button type="submit" class="btn btn-success">Сохранить</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layouts::footer}"></div>
</body>
</html>
