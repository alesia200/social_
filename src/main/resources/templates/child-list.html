<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список детей</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">Реабилитационный Центр</a>
    </div>
</nav>

<div class="container">
    <h1 class="mb-4">Профили детей</h1>

    <div class="mb-3">
        <a href="/children/create" class="btn btn-success">Добавить ребенка</a>
        <a href="/admin/users" class="btn btn-secondary">Пользователи</a>
    </div>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>ФИО</th>
            <th>Дата рождения</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="child : ${children}">
            <td th:text="${child.id}">1</td>
            <td th:text="${child.surname + ' ' + child.name + ' ' + child.patronymic}">Иванов Иван Иванович</td>
            <td th:text="${child.dateOfBirth}">2010-01-01</td>
            <td>
                <!-- Кнопка просмотра профиля -->
                <a th:href="@{/children/{id}(id=${child.id})}" class="btn btn-info btn-sm text-white">Профиль</a>

                <!-- Кнопка просмотра журнала занятий этого ребенка -->
                <a th:href="@{/sessions/child/{id}(id=${child.id})}" class="btn btn-outline-primary btn-sm">Журнал</a>

                <!-- Кнопки редактирования и удаления -->
                <a th:href="@{/children/update/{id}(id=${child.id})}" class="btn btn-primary btn-sm">Редактировать</a>
                <a th:href="@{/children/delete/{id}(id=${child.id})}" class="btn btn-danger btn-sm"
                   onclick="return confirm('Удалить профиль ребенка?');">Удалить</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
