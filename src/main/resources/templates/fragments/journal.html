<!-- templates/children/fragments/journal.html -->
<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h6 class="mb-0 fw-semibold text-muted" style="font-size:13px;">
            Записи о проведённых занятиях
        </h6>
        <input type="month" class="form-control form-control-sm" style="width:auto;">
    </div>

    <!-- Пустое состояние -->
    <div th:if="${sessions == null or sessions.isEmpty()}" class="empty-state">
        <i class="bi bi-journal-x d-block"></i>
        <h5>Нет записей в журнале</h5>
        <p>Записи появятся автоматически после проведения занятий</p>
    </div>

    <!-- Таблица -->
    <div th:if="${sessions != null and !sessions.isEmpty()}" class="table-responsive">
        <table class="table table-bordered mb-0">
            <thead>
            <tr style="background:#f8fafc;">
                <th>Дата</th>
                <th>Время</th>
                <th>Направление</th>
                <th>Дефектолог</th>
                <th>Статус</th>
                <th>Оценка</th>
                <th style="width:100px;">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${sessions}">
                <td class="fw-medium" th:text="${s.date}">15.01.2024</td>
                <td th:text="${s.time}">09:00</td>
                <td>
                    <span class="badge-status badge-info-light" th:text="${s.direction}">Логопедия</span>
                </td>
                <td th:text="${s.defectologistName}">Петрова И.В.</td>
                <td>
                        <span th:classappend="${s.status == 'completed'} ? 'badge-success-light' : (${s.status == 'missed'} ? 'badge-danger-light' : 'badge-warning-light')"
                              class="badge-status"
                              th:text="${s.status == 'completed'} ? 'Проведено' : (${s.status == 'missed'} ? 'Пропущено' : 'Запланировано')">Проведено</span>
                </td>
                <td>
                        <span th:if="${s.rating != null}">
                            <i th:each="i : ${#numbers.sequence(1, 5)}"
                               th:classappend="${i <= s.rating} ? 'bi-star-fill text-warning' : 'bi-star text-muted'"
                               class="bi me-0" style="font-size:13px;"></i>
                        </span>
                    <span th:unless="${s.rating != null}" class="text-muted">—</span>
                </td>
                <td>
                    <button class="btn btn-outline-primary btn-sm"
                            onclick="openSessionModal(this)"
                            th:data-session-id="${s.id}"
                            th:disabled="${s.status == 'cancelled'}">
                        <i class="bi bi-pencil me-1"></i> Заполнить
                    </button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- ═══ МОДАЛКА: Заполнить занятие ═══ -->
    <div class="modal fade" id="sessionModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-journal-text me-2 text-primary"></i> Заполнить занятие
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="sessionForm" method="post">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Статус</label>
                            <select class="form-select form-select-sm" name="status">
                                <option value="completed">Проведено</option>
                                <option value="missed">Пропущено (по ув. причине)</option>
                                <option value="cancelled">Отменено</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Оценка реакции ребёнка</label>
                            <div class="d-flex gap-1" id="starRating">
                                <button type="button" onclick="setRating(1)" class="btn btn-sm p-0 border-0">
                                    <i class="bi bi-star text-muted" style="font-size:22px;"></i></button>
                                <button type="button" onclick="setRating(2)" class="btn btn-sm p-0 border-0">
                                    <i class="bi bi-star text-muted" style="font-size:22px;"></i></button>
                                <button type="button" onclick="setRating(3)" class="btn btn-sm p-0 border-0">
                                    <i class="bi bi-star text-muted" style="font-size:22px;"></i></button>
                                <button type="button" onclick="setRating(4)" class="btn btn-sm p-0 border-0">
                                    <i class="bi bi-star text-muted" style="font-size:22px;"></i></button>
                                <button type="button" onclick="setRating(5)" class="btn btn-sm p-0 border-0">
                                    <i class="bi bi-star text-muted" style="font-size:22px;"></i></button>
                            </div>
                            <input type="hidden" name="rating" id="ratingInput" value="0">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Тема занятия</label>
                            <input type="text" class="form-control form-control-sm" name="topic"
                                   placeholder="Тема проведённого занятия">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ход занятия</label>
                            <textarea class="form-control form-control-sm" name="description" rows="3"
                                      placeholder="Описание хода занятия..."></textarea>
                        </div>
                        <div class="mb-0">
                            <label class="form-label">Домашнее задание</label>
                            <textarea class="form-control form-control-sm" name="homework" rows="2"
                                      placeholder="Задание для занятий дома..."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary btn-sm"
                                data-bs-dismiss="modal">Отмена</button>
                        <button type="submit" class="btn btn-primary btn-sm">
                            <i class="bi bi-check-lg me-1"></i> Сохранить
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let currentRating = 0;

        function setRating(val) {
            currentRating = val;
            document.getElementById('ratingInput').value = val;
            const stars = document.querySelectorAll('#starRating .bi');
            stars.forEach((s, i) => {
                if (i < val) {
                    s.classList.remove('bi-star', 'text-muted');
                    s.classList.add('bi-star-fill', 'text-warning');
                } else {
                    s.classList.remove('bi-star-fill', 'text-warning');
                    s.classList.add('bi-star', 'text-muted');
                }
            });
        }

        function openSessionModal(btn) {
            const sid = btn.dataset.sessionId;
            const base = window.location.pathname.replace(/\/journal.*$/, '');
            document.getElementById('sessionForm').action = base + '/journal/' + sid;
            new bootstrap.Modal(document.getElementById('sessionModal')).show();
        }

        // Сброс звёзд при закрытии модалки
        document.getElementById('sessionModal').addEventListener('hidden.bs.modal', () => {
            currentRating = 0;
            document.getElementById('ratingInput').value = 0;
            document.querySelectorAll('#starRating .bi').forEach(s => {
                s.classList.remove('bi-star-fill', 'text-warning');
                s.classList.add('bi-star', 'text-muted');
            });
        });
    </script>

</div>

</body>
</html>
