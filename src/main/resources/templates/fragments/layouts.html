<!doctype html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"> <!-- Важно для проверки ролей -->

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Реабилитационный центр</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        /* кастомный стиль, чтобы сайдбар занимал всю высоту */
        body {
            min-height: 100vh;
        }
        .sidebar {
            min-height: calc(100vh - 56px); /* Высота окна минус высота шапки */
        }
    </style>
</head>

<!-- Шапка -->
<header th:fragment="header">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container-fluid">
            <!-- Логотип/Название -->
            <a class="navbar-brand fw-bold" th:href="@{/}">
                <i class="bi bi-heart-pulse-fill me-2"></i>Реабилитационный Центр
            </a>

            <!-- Информация о пользователе справа -->
            <div class="d-flex align-items-center">
                <span class="text-white me-3">
                    <i class="bi bi-person-circle"></i>
                    <span th:text="${#authentication.principal.getUser().getSurname()}">Фамилия</span>
                    <span th:text="${#authentication.principal.getUser().getName()}">Имя</span>
                    <small class="opacity-75 ms-1">
                        (<span th:text="${#authentication.principal.getUser().getPosition()}">Должность</span>)
                    </small>
                </span>

                <!-- Форма выхода -->
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-box-arrow-right me-1"></i> Выйти
                    </button>
                </form>
            </div>
        </div>
    </nav>
</header>

<!-- Боковое меню (Сайдбар) -->
<div th:fragment="sidebar">
    <div class="d-flex flex-column p-3 bg-light sidebar">
        <ul class="nav nav-pills flex-column mb-auto">

            <!-- 1. Главная (Дашборд) - Доступна всем -->
            <li class="nav-item">
                <a th:href="@{/}" class="nav-link link-dark" sec:authorize="isAuthenticated()">
                    <i class="bi bi-house-door me-2"></i> Главная
                </a>
            </li>

            <!-- Раздел: Администрирование (Только ADMIN) -->
            <li sec:authorize="hasRole('ADMIN')">
                <span class="nav-link disabled small text-uppercase text-muted mt-2">Администрирование</span>
            </li>
            <li sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/admin/users}" class="nav-link link-dark">
                    <i class="bi bi-people me-2"></i> Пользователи
                </a>
            </li>

            <!-- Раздел: Дети, расписание (ADMIN, SOCIAL_WORKER) -->
            <!-- Дефектолог тоже видит детей, но функционал у него другой -->
            <li class="nav-item">
                <a th:href="@{/children}" class="nav-link link-dark">
                    <i class="bi bi-person-lines-fill me-2"></i> Дети
                </a>
            </li>

            <!-- Расписание (Только Соц. работник) -->
            <!-- Расписание (Для Соцработника и Дефектолога) -->
            <li class="nav-item">
                <!-- Ссылка для Соцработника (видит всех) -->
                <a class="nav-link link-dark"
                   th:if="${#authorization.expression('hasRole(''ROLE_SOCIAL_WORKER'')')}"
                   th:href="@{/schedule}">
                    <i class="bi bi-calendar me-2"></i> Расписание
                </a>

                <!-- Ссылка для Дефектолога (видит только свое) -->
                <a class="nav-link link-dark"
                   th:if="${#authorization.expression('hasRole(''ROLE_DEFECTOLOGIST'')')}"
                   th:href="@{/defectologist/schedule}">
                    <i class="bi bi-calendar me-2"></i> Мое расписание
                </a>
            </li>
            <!-- Раздел: Специфика ролей -->

            <!-- Диагностика (Для Дефектолога и Соц. работника) -->


            <!-- Отчеты и Документы (Только Соц. работник) -->
            <li class="nav-item">
                <a class="nav-link d-flex align-items-center" th:href="@{/social/reports}">
                    <i class="bi bi-file-earmark-bar-graph me-2"></i> Аналитика
                </a>
            </li>
        </ul>
    </div>
</div>

<!-- Подвал -->
<footer class="bg-light py-3 border-top mt-auto" th:fragment="footer">
    <div class="container text-center">
        <span class="text-muted">Курсовой проект "Реабилитационный центр"</span>
    </div>
</footer>

</html>
