<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Форма пользователя</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">Реабилитационный Центр</a>
    </div>
</nav>

<div class="container">
    <div class="card" style="max-width: 600px; margin: auto;">
        <div class="card-header bg-primary text-white">
            <!-- Заголовок меняется в зависимости от того, новый это пользователь или нет -->
            <h4 th:if="${user.id == null}">Добавление пользователя</h4>
            <h4 th:if="${user.id != null}">Редактирование пользователя</h4>
        </div>
        <div class="card-body">
            <!-- Форма отправляет данные на /admin/users/save -->
            <form th:action="@{/admin/users/save}" th:object="${user}" method="post">

                <!-- Скрытое поле ID (нужно для редактирования) -->
                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label class="form-label">Логин</label>
                    <input type="text" th:field="*{username}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    <input type="password" th:field="*{password}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Роль</label>
                    <select th:field="*{role}" class="form-select">
                        <!-- Перебираем все значения Enum Role -->
                        <option th:each="role : ${T(com.example.social.model.Role).values()}"
                                th:value="${role}"
                                th:text="${role}">
                        </option>
                    </select>
                </div>

                <hr>
                <h5>Личные данные</h5>

                <div class="mb-3">
                    <label class="form-label">Фамилия</label>
                    <input type="text" th:field="*{surname}" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Имя</label>
                    <input type="text" th:field="*{name}" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Отчество</label>
                    <input type="text" th:field="*{patronymic}" class="form-control">
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <a href="/admin/users" class="btn btn-secondary">Отмена</a>
                    <button type="submit" class="btn btn-success">Сохранить</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
