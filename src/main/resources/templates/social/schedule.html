<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layouts :: head('Общее расписание')}">
</head>
<body>
<div th:replace="~{fragments/layouts::header}"></div>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-3 col-lg-2 p-0">
            <div th:replace="~{fragments/layouts::sidebar}"></div>
        </div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-3">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="mb-0">📅 Общее расписание занятий</h4>

                <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#scheduleModal"
                        sec:authorize="hasRole('SOCIAL_WORKER')">
                    <i class="bi bi-plus-circle me-1"></i> Запланировать занятие
                </button>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover table-bordered align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th>Дата</th>
                                <th>Время</th>
                                <th>Дефектолог</th>
                                <th>Ребенок</th>
                                <th>Тип занятия</th>
                                <th style="width: 80px;" sec:authorize="hasRole('SOCIAL_WORKER')">Действия</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="sched : ${schedules}">
                                <td th:text="${#temporals.format(sched.date, 'dd.MM.yyyy')}">02.04.2026</td>
                                <td th:text="${#temporals.format(sched.time, 'HH:mm')}">10:00</td>
                                <td th:text="${sched.defectologist.surname + ' ' + sched.defectologist.name}">Иванова И.И.</td>
                                <td th:text="${sched.child.surname + ' ' + sched.child.name}">Петров Петр</td>
                                <td>
                                    <span class="badge bg-success" th:if="${sched.lessonType == 'Индивидуальное'}" th:text="${sched.lessonType}">Инд.</span>
                                    <span class="badge bg-primary" th:if="${sched.lessonType == 'Групповое'}" th:text="${sched.lessonType}">Груп.</span>
                                </td>
                                <!-- ИЗМЕНЕНО 1: Кнопка заменена на ссылку для передачи ID -->
                                <td sec:authorize="hasRole('SOCIAL_WORKER')">
                                    <a th:href="@{/social/schedule/edit/{id}(id=${sched.id})}" class="btn btn-sm btn-outline-warning" title="Редактировать">
                                        <i class="bi bi-pencil-square"></i>
                                    </a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- ========================================== -->
<!-- МОДАЛЬНОЕ ОКНО: Создание/Редактирование   -->
<!-- ========================================== -->
<div class="modal fade" id="scheduleModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Планирование занятия</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
            </div>

            <form th:action="@{/social/schedule/save}" th:object="${scheduleForm}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" th:field="*{id}" />

                <div class="modal-body">
                    <div class="row g-3">
                        <!-- ИЗМЕНЕНО 2: Динамический список дефектологов из БД -->
                        <div class="col-12">
                            <label class="form-label">Дефектолог <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{defectologistId}" required>
                                <option value="">Выберите специалиста...</option>
                                <option th:each="d : ${defectologists}"
                                        th:value="${d.id}"
                                        th:text="${d.surname + ' ' + d.name + ' (' + d.position + ')'}">Специалист</option>
                            </select>
                        </div>

                        <!-- ИЗМЕНЕНО 3: Динамический список детей из БД -->
                        <div class="col-12">
                            <label class="form-label">Ребенок <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{childId}" required>
                                <option value="">Выберите ребенка...</option>
                                <option th:each="c : ${children}"
                                        th:value="${c.id}"
                                        th:text="${c.surname + ' ' + c.name}">Ребенок</option>
                            </select>
                        </div>

                        <div class="col-6">
                            <label class="form-label">Дата <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" th:field="*{date}" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Время <span class="text-danger">*</span></label>
                            <input type="time" class="form-control" th:field="*{time}" required>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Тип занятия</label>
                            <select class="form-select" th:field="*{lessonType}">
                                <option value="Индивидуальное">Индивидуальное</option>
                                <option value="Групповое">Групповое</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i> Сохранить
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layouts::footer}"></div>

<!-- ИЗМЕНЕНО 4: Скрипт автоматического открытия окна при редактировании -->
<script th:if="${scheduleForm.id != null}">
    document.addEventListener("DOMContentLoaded", function() {
        var myModal = new bootstrap.Modal(document.getElementById('scheduleModal'));
        myModal.show();
    });
</script>

<!-- Подключение Bootstrap JS (Должно быть в самом конце!) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
