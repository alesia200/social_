<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layouts :: head('Мое расписание')}">
</head>
<body>
<div th:replace="~{fragments/layouts::header}"></div>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-3 col-lg-2 p-0">
            <div th:replace="~{fragments/layouts::sidebar}"></div>
        </div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-3">

            <h4 class="mb-4">📅 Мое расписание занятий</h4>

            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover table-bordered align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th>Дата</th>
                                <th>Время</th>
                                <th>Ребенок</th>
                                <th>Тип занятия</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="sched : ${schedules}">
                                <td th:text="${#temporals.format(sched.date, 'dd.MM.yyyy')}">02.04.2026</td>
                                <td th:text="${#temporals.format(sched.time, 'HH:mm')}">10:00</td>
                                <td th:text="${sched.child.surname + ' ' + sched.child.name}">Петров Петр</td>
                                <td>
                                    <span class="badge bg-success" th:if="${sched.lessonType == 'Индивидуальное'}" th:text="${sched.lessonType}">Инд.</span>
                                    <span class="badge bg-primary" th:if="${sched.lessonType == 'Групповое'}" th:text="${sched.lessonType}">Груп.</span>
                                </td>
                            </tr>
                            <tr th:if="${schedules == null or schedules.isEmpty()}">
                                <td colspan="4" class="text-center text-muted py-4">
                                    У вас пока нет назначенных занятий.
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>
<div th:replace="~{fragments/layouts::footer}"></div>
</body>
</html>
