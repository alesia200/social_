<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layouts::head('Профиль ребенка')}">
<body>
<div th:replace="~{fragments/layouts::header}"></div>
<div class="container-fluid">
    <div class="row">
        <!-- Сайдбар -->
        <div class="col-md-3 col-lg-2 p-0">
            <div th:replace="~{fragments/layouts::sidebar}"></div>
        </div>

        <!-- Основной контент страницы -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-3">

            <!-- Breadcrumbs -->
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/}">Главная</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/children}">Список детей</a></li>
                    <!-- Промежуточный пункт только при редактировании -->
                    <li class="breadcrumb-item" th:if="${child.id != null}">
                        <a th:href="@{/children/{id}(id=${child.id})}"
                           th:text="${child.surname + ' ' + child.name + ' ' + child.patronymic}">ФИО</a>
                    </li>
                    <!-- Текущая страница -->
                    <li class="breadcrumb-item active" aria-current="page" th:if="${child.id == null}">
                        Добавление профиля
                    </li>
                    <li class="breadcrumb-item active" aria-current="page" th:if="${child.id != null}">
                        Редактирование профиля
                    </li>
                </ol>
            </nav>

            <!-- Плашка с ФИО ребёнка -->
            <div class="card mb-3">
                <div class="card-body d-flex align-items-center justify-content-between">
                    <div>
                        <!-- Создание -->
                        <h4 class="mb-1" th:if="${child.id == null}">Новый профиль</h4>
                        <!-- Редактирование -->
                        <div th:if="${child.id != null}">
                            <h4 class="mb-1"
                                th:text="${child.surname + ' ' + child.name + ' ' + child.patronymic}">
                                Фамилия Имя Отчество
                            </h4>
                            <div class="text-muted" th:if="${child.birthDate != null}"
                                 th:text="'Дата рождения: ' + ${#temporals.format(child.birthDate, 'dd.MM.yyyy')}">
                                Дата рождения: —
                            </div>
                        </div>
                    </div>
                    <div>
                        <!-- Кнопка отмены ведет либо к списку, либо к просмотру профиля -->
                        <a th:if="${child.id == null}" th:href="@{/children}"
                           class="btn btn-outline-secondary btn-sm">Отмена</a>
                        <a th:if="${child.id != null}" th:href="@{/children/{id}(id=${child.id})}"
                           class="btn btn-outline-secondary btn-sm">Отмена</a>
                        <button type="submit" form="child-form" class="btn btn-success btn-sm">Сохранить</button>
                    </div>
                </div>
            </div>

            <!-- Вкладки -->
            <ul class="nav nav-tabs" id="childTabs" role="tablist">
                <!-- Личные данные -->
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="personal-tab" data-bs-toggle="tab"
                            data-bs-target="#personal" type="button" role="tab"
                            aria-controls="personal" aria-selected="true">
                        Личные данные
                    </button>
                </li>
                <!-- Диагностика -->
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="diagnostics-tab" data-bs-toggle="tab"
                            data-bs-target="#diagnostics" type="button" role="tab"
                            aria-controls="diagnostics" aria-selected="false">
                        Диагностика
                    </button>
                </li>
                <!-- Расписание -->
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="schedule-tab" data-bs-toggle="tab"
                            data-bs-target="#schedule" type="button" role="tab"
                            aria-controls="schedule" aria-selected="false">
                        Расписание
                    </button>
                </li>
                <!-- Журнал занятий -->
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="class-journal" data-bs-toggle="tab"
                            data-bs-target="#class-journal" type="button" role="tab"
                            aria-controls="class-journal" aria-selected="false">
                        Журнал занятий
                    </button>
                </li>
            </ul>

            <!-- Контент вкладок -->
            <form th:action="@{/children/save}" th:object="${child}" method="post" id="child-form">
                <input type="hidden" th:field="*{id}"/>
                <input type="hidden" th:field="*{disabilityInfo.id}"/>
                <div class="tab-content p-3 border border-top-0 rounded-bottom" id="childTabsContent">
                    <!-- Вкладка: Личные данные -->
                    <div class="tab-pane fade show active" id="personal" role="tabpanel"
                         aria-labelledby="personal-tab">
                        <div th:replace="~{fragments/child/personal-data :: form-view}"></div>
                    </div>
                </div>
            </form>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layouts::footer}"></div>
</body>
</html>
