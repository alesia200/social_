<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layouts::head('Журнал занятий')}">
</head>
<body>
<div th:replace="~{fragments/layouts::header}"></div>
<div class="container-fluid">
    <div class="row">
        <!-- Сайдбар -->
        <div class="col-md-3 col-lg-2 p-0">
            <div th:replace="~{fragments/layouts::sidebar}"></div>
        </div>

        <!-- Основной контент страницы -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-3">

            <!-- Breadcrumbs -->
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/}">Главная</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/children}">Список детей</a></li>
                    <li class="breadcrumb-item">
                        <a th:href="@{/children/{id}(id=${child.id})}"
                           th:text="${child.surname + ' ' + child.name + ' ' + child.patronymic}">ФИО</a>
                    </li>
                    <li class="breadcrumb-item active" aria-current="page">Журнал занятий</li>
                </ol>
            </nav>

            <!-- Заголовок страницы -->
            <div class="card mb-4 shadow-sm">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <h4 class="mb-1">📒 Журнал занятий</h4>
                        <div class="text-muted" th:text="'Ребенок: ' + ${child.surname + ' ' + child.name} + ' | ID курса: ' + ${courseId}">
                            Информация о курсе
                        </div>
                    </div>
                    <a th:href="@{/children/{id}(id=${child.id})}" class="btn btn-outline-secondary btn-sm">
                        Закрыть окно
                    </a>
                </div>
            </div>

            <!-- Форма добавления записи в журнал -->
            <div class="card shadow-sm">
                <div class="card-header bg-light fw-bold">
                    Добавить запись в журнал
                </div>
                <div class="card-body">

                    <form th:action="@{/children/{id}/journal/save(id=${child.id})}" method="post">

                        <!-- ОБЯЗАТЕЛЬНО: Защита от 403 ошибки -->
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <input type="hidden" name="courseId" th:value="${courseId}" />

                        <div class="row g-3">
                            <!-- Дата занятия -->
                            <div class="col-md-3">
                                <label for="lessonDate" class="form-label">Дата занятия</label>
                                <input type="date" class="form-control" id="lessonDate" name="lessonDate" required>
                            </div>

                            <!-- Присутствие -->
                            <div class="col-md-3">
                                <label for="attendance" class="form-label">Посещаемость</label>
                                <select class="form-select" id="attendance" name="attendance">
                                    <option value="PRESENT">Присутствовал</option>
                                    <option value="ABSENT">Отсутствовал</option>
                                    <option value="LATE">Опоздал</option>
                                </select>
                            </div>

                            <!-- Тема занятия -->
                            <div class="col-md-6">
                                <label for="topic" class="form-label">Тема / Материал занятия</label>
                                <input type="text" class="form-control" id="topic" name="topic" placeholder="Например: Развитие мелкой моторики">
                            </div>

                            <!-- Оценка/Результат -->
                            <div class="col-md-6">
                                <label for="result" class="form-label">Результат / Динамика</label>
                                <textarea class="form-control" id="result" name="result" rows="2" placeholder="Краткое описание реакции ребенка..."></textarea>
                            </div>

                            <!-- Домашнее задание -->
                            <div class="col-md-6">
                                <label for="homework" class="form-label">Домашнее задание для родителей</label>
                                <textarea class="form-control" id="homework" name="homework" rows="2" placeholder="Рекомендации для закрепления дома..."></textarea>
                            </div>
                        </div>

                        <div class="mt-4">
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-check-circle me-1"></i> Сохранить запись
                            </button>
                        </div>
                    </form>

                </div>
            </div>

            <!-- Здесь позже будет таблица с уже сохраненными записями -->
            <div class="alert alert-light text-center mt-4">
                Список предыдущих занятий будет отображаться здесь.
            </div>

        </main>
    </div>
</div>
<div th:replace="~{fragments/layouts::footer}"></div>
</body>
</html>
