<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layouts::head('Список детей')}">
<body>
<div th:replace="~{fragments/layouts::header}"></div>

<div class="container-fluid">
    <div class="row">
        <!-- Сайдбар -->
        <div class="col-md-3 col-lg-2 p-0">
            <div th:replace="~{fragments/layouts::sidebar}"></div>
        </div>

        <!-- Основной контент страницы -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-3">
            <div class="container">
                <h1 class="mb-4">Профили детей</h1>

                <div class="mb-3">
                    <a href="/children/create" class="btn btn-success">Добавить ребенка</a>
                </div>

                <table class="table table-striped table-bordered">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>ФИО</th>
                        <th>Дата рождения</th>
                        <th>Действия</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="child : ${children}">
                        <td th:text="${child.id}">1</td>
                        <td th:text="${child.surname + ' ' + child.name + ' ' + child.patronymic}">Иванов Иван Иванович</td>
                        <td th:text="${child.birthDate}">2010-01-01</td>
                        <td>
                            <!-- Кнопка просмотра профиля -->
                            <a th:href="@{/children/{id}(id=${child.id})}" class="btn btn-info btn-sm text-white">Профиль</a>
                            <!-- Кнопки редактирования и удаления -->
                            <a th:href="@{/children/edit/{id}(id=${child.id})}" class="btn btn-primary btn-sm">Редактировать</a>
                            <a th:href="@{/children/delete/{id}(id=${child.id})}" class="btn btn-danger btn-sm"
                               onclick="return confirm('Удалить профиль ребенка?');">Удалить</a>
                            <!-- Кнопка просмотра журнала занятий этого ребенка -->
                            <a th:href="@{/sessions/child/{id}(id=${child.id})}" class="btn btn-outline-primary btn-sm">Журнал</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{fragments/layouts::footer}"></div>
</body>
</html>
