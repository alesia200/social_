<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список пользователей</title>
    <!-- Подключаем Bootstrap для красивого оформления -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<!-- Навигационное меню (простое) -->
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">Реабилитационный Центр</a>
    </div>
</nav>

<div class="container">
    <h1 class="mb-4">Управление пользователями</h1>

    <!-- Кнопка добавления -->
    <div class="mb-3">
        <a href="/admin/users/create" class="btn btn-success">Добавить пользователя</a>
    </div>

    <!-- Таблица пользователей -->
    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Логин</th>
            <th>Роль</th>
            <th>ФИО</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <!-- Цикл Thymeleaf: проходимся по списку users -->
        <tr th:each="user : ${users}">
            <td th:text="${user.id}">1</td>
            <td th:text="${user.username}">login</td>
            <td th:text="${user.role}">ROLE</td>
            <td th:text="${user.surname + ' ' + user.name + ' ' + user.patronymic}">Иванов Иван Иванович</td>
            <td>
                <!-- Кнопки редактирования и удаления -->
                <a th:href="@{/admin/users/update/{id}(id=${user.id})}" class="btn btn-primary btn-sm">Редактировать</a>
                <a th:href="@{/admin/users/delete/{id}(id=${user.id})}" class="btn btn-danger btn-sm"
                   onclick="return confirm('Вы уверены, что хотите удалить пользователя?');">Удалить</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
